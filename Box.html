<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>box site</title>
<style>
    #one {
        width:200px;
        height:300px;
        background:rgb(0, 85, 255);
        color:#fff;
        padding:20px;
        margin:50px;
        border:10px solid #ffd500;
        border-top:20px solid #ff2b83;
        border-bottom:20px solid #ff2b83;
        box-shadow:10px 10px 10px #a1a1a1
    }
    #two {
    width: 500px;
        height:50px;
        background:rgb(35, 196, 86);
        color:#fff;
        padding:20px;
        margin:50px;
        border:10px solid #00ccff;
        border-top:20px solid #ff2b2b;
        border-bottom:20px solid #ff2b2b;
        box-shadow:10px 10px 10px #a1a1a1
    }

    #three {
    width: 70px;
        height:50px;
        background:#2e23c4;
        color:#fff;
        padding:20px;
        margin:50px;
        border:10px solid #8000ff;
        border-top:20px solid #ff2bc3;
        border-bottom:20px solid #ff2bc3;
        box-shadow:10px 10px 10px #a1a1a1
    }

    #four {
    width: 700px;
        height:3000px;
        background:#238cc4;
        color:#fff;
        padding:20px;
        margin:50px;
        border:10px solid #00ff37;
        border-top:20px solid #ff802b;
        border-bottom:20px solid #ff802b;
        box-shadow:10px 10px 10px #a1a1a1
    }

</style>
</head>
     
<body>
<div id="one">
    <p>this is the first box.</p>
</div>

<div id="two">
    <p>this is the second box.</p>
</div>

<div id="three">
    <p>this is the third box.</p>
</div>

<div id="four">
    <p>this is the fourth box.</p>
</div>

</body>

</html>
