<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>Class id demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
<style>
    body{
        font-family: "Onest", sans-serif;

 background: #5EB1BF;
        color: #fff;

    p.jello {

    }

    li a{

        text-align:center;

    }
    li a: hover{
        background: red;
    }

</style>
</head>
     
<body>
<h1>Class id Demo</h1>   
<p class="jello">gfdskgdhkdewjhjdekl</p>

<p class="jello">edrftgyuhijgyftrhuuh</p>

</ul>
