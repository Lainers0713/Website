<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>transition site</title>
<style>
 #one {
    width:100px;
    height:100px;
    background: #ff8cb1;
    border:5px solid #ff6c1d;
    transition: transform 0.5s, background 0.5s;
 }
 #one:hover {
    transform: rotate(45deg);
    background: #ff6c1d;
    border:5px solid #ff8cb1;
 }
 #two {
    width:100px;
    height:100px;
    background: #1da0e1;
    border:5px solid #ff6c1d;
    transition: transform 0.5s, background 0.5s;
 }
 #two:hover {
    transform: translate(10px, 25px);
    background: #ff6c1d;
    border:5px solid #1da0e1;
 }
 #three {
    width:100px;
    height:100px;
    background: #ae38c3;
    border:5px solid #ff6c1d;
    transition: transform 0.5s, background 0.5s;
 }
 #three:hover {
    transform: scale(.75, .75);
    background: #ff6c1d;
    border:5px solid #ae38c3;
 }
 #four {
    width:100px;
    height:100px;
    background: #35d13a;
    border:5px solid #ff6c1d;
    transition: transform 0.5s, background 0.5s;
 }
 #four:hover {
    transform: skewX(15deg);
    background: #ff6c1d;
    border:5px solid #35d13a;
 }
</style>
</head>
     
<body>
<div id="one"></div>
<div id="two"></div>
<div id="three"></div>
<div id="four"></div>

</body>

</html>
